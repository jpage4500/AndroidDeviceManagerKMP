org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

kotlin.incremental.native=true

# Kotlin
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
# source sets are wired by hand in composeApp/build.gradle.kts so desktop and android can share
# jvmCommonMain — the default template has no such node
kotlin.mpp.applyDefaultHierarchyTemplate=false

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
