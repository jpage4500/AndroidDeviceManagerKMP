name: Desktop (jDeploy)

# Builds the desktop fat jar and publishes native installers to the PUBLIC release repo via
# jDeploy (https://www.jdeploy.com).
#
# Flow: merge to main -> job 2 tags "2.0.<commit count>" -> the tag push runs job 3, which builds
# and publishes. The tag is what makes jDeploy cut a versioned release; on a branch push it instead
# publishes a rolling prerelease at version "0.0.0-<branch>".
#
# Needs the GH_TOKEN secret — a PAT with contents:write on BOTH this repo (to push the tag) and the
# release repo (to create the release). See docs/RELEASING.md.

on:
  push:
    branches:
      - main
    # only version tags. jDeploy creates a tag literally named 'jdeploy' to hold
    # package-info.json, and a 'tags: [*]' filter would re-trigger this workflow on it — publishing
    # a bogus release at version "jdeploy" and pointing dist-tags.latest at it
    tags:
      - '2.0.*'
  workflow_dispatch:

concurrency:
  group: jdeploy-release-${{ github.repository }}
  cancel-in-progress: false

# the PUBLIC repo releases and the README are published to; this repo is private.
# declared at workflow scope because two jobs need it — a step writing it into $GITHUB_ENV is
# job-scoped, so sync-readme couldn't see it
env:
  TARGET_REPO: jpage4500/AndroidDeviceManager2

# needed to create tags and releases
permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: mirror README + its images to the public repo
  # ==========================================
  # deliberately NOT a dependency of tag-release: a docs sync failing shouldn't hold up a release.
  # it runs on the merge, so it lands well before the tag-triggered build gets as far as publishing
  sync-readme:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync README to ${{ env.TARGET_REPO }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          chmod +x scripts/sync_public_readme.sh
          ./scripts/sync_public_readme.sh "${{ env.TARGET_REPO }}"

  # ==========================================
  # JOB 2: auto-tag on merge to main
  # ==========================================
  tag-release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # CRITICAL: must be a PAT. A push made with the default GITHUB_TOKEN does not trigger
          # workflows, so build-and-deploy below would never run
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Get version and push tag
        run: |
          # the same "2.0.<commit count>" scheme composeApp/build.gradle.kts uses — same commit,
          # same count, so the tag and APP_VERSION always agree
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION="2.0.${COMMIT_COUNT}"

          echo "Calculated version: $VERSION"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "✅ Tag $VERSION already exists. No new release needed."
          else
            echo "▶ Creating and pushing new tag: $VERSION"
            git config user.name "GitHub Actions Bot"
            git config user.email "<>"
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

  # ==========================================
  # JOB 3: build and deploy (triggered by the tag)
  # ==========================================
  build-and-deploy:
    # second guard against publishing jDeploy's own metadata tag as if it were a release
    if: ${{ github.ref_type == 'tag' && github.ref_name != 'jdeploy' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so gen_release_notes.sh can log commits back to the previous tag
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write secrets to gradle.properties
        uses: ./.github/actions/write-secrets
        with:
          secrets_json: ${{ toJSON(secrets) }}

      # buildExecutableJar is also what flips BuildConfig IS_RELEASE to true — see
      # composeApp/build.gradle.kts
      - name: Build desktop jar
        run: ./gradlew :composeApp:buildExecutableJar

      # publish under the pushed tag, so the release jDeploy creates in the target repo is named the
      # same thing the "Update GitHub release" step below looks up
      - name: Resolve publish version
        run: |
          VERSION="${{ github.ref_name }}"
          GRADLE_VERSION=$(./gradlew -q printVersion | tail -n 1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Publishing as: $VERSION (gradle APP_VERSION: $GRADLE_VERSION)"

      # -- JDEPLOY --
      - name: Setup Node.js & cache npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package.json'

      - name: Sync package.json version
        run: |
          echo "Setting package.json version to ${{ env.VERSION }}"
          npm version ${{ env.VERSION }} --no-git-tag-version

      # uploads the mac/windows/linux installers as release assets, and updates package-info.json
      # on the target repo's 'jdeploy' tag — which is what installed apps read to auto-update
      - name: jDeploy publish to public repo
        uses: shannah/jdeploy@master
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          target_repository: ${{ env.TARGET_REPO }}
          deploy_target: 'github'

      # also attach the fat jar, for running headless or on a platform with no installer.
      # uploaded with the CLI rather than an action so the release body jDeploy just wrote is left alone
      - name: Attach jar to release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh release upload "${{ env.VERSION }}" composeApp/build/libs/adm-all.jar \
            --repo "${{ env.TARGET_REPO }}" --clobber

      - name: Generate release notes
        env:
          # only used to look up PR titles for merge commits; read access is enough
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/gen_release_notes.sh
          ./scripts/gen_release_notes.sh "pr" "brief" > notes.raw || true

          # drop blank lines and empty-subject commits, then normalise to "- " markdown bullets
          grep -v '^[[:space:]]*$' notes.raw \
            | grep -viE '^[[:space:]]*-?[[:space:]]*no message[[:space:]]*$' \
            | sed -E 's/^[[:space:]]*-[[:space:]]*//; s/^/- /' > release-notes.txt || true

          if [[ ! -s release-notes.txt ]]; then
            echo "- no changes" > release-notes.txt
          fi

          echo "Generated release notes:"
          cat release-notes.txt

      # jDeploy has already written the installer download links into the body — keep them and put
      # the release notes above.
      #
      # IMPORTANT: --draft=false is required. jDeploy uploads tag releases through
      # xresloader/upload-to-github-release, which defaults draft=true and jDeploy never overrides
      # it — so the release is created hidden and its assets 404 for the launcher.
      - name: Publish GitHub release with notes
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          EXISTING=$(gh release view "${{ env.VERSION }}" \
            --repo "${{ env.TARGET_REPO }}" \
            --json body -q '.body' || echo "")

          # if the body couldn't be read, fall back to the installer links jdeploy generated
          INSTALLER_LINKS=./jdeploy/github-release-files/jdeploy-release-notes.md
          if [[ -z "$EXISTING" && -f "$INSTALLER_LINKS" ]]; then
            EXISTING=$(cat "$INSTALLER_LINKS")
          fi

          { echo "## Release Notes"; echo ""; cat release-notes.txt; echo ""; echo "$EXISTING"; } > combined-notes.txt

          gh release edit "${{ env.VERSION }}" \
            --notes-file combined-notes.txt \
            --draft=false \
            --latest \
            --repo "${{ env.TARGET_REPO }}"
