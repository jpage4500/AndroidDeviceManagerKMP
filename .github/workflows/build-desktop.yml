name: Desktop (jDeploy)

# Builds the desktop fat jar and publishes native installers to this repo's releases via
# jDeploy (https://www.jdeploy.com).
#
# Flow: merge to main -> job 1 tags "2.0.<commit count>" -> the tag push runs job 2, which is one
# call to scripts/build-desktop.sh — the same script a local publish runs. The same tag also starts
# build-android.yml.
#
# Needs the GH_TOKEN secret — a PAT with contents:write on this repo, to push the tag and create the
# release. See docs/RELEASING.md.

on:
  push:
    branches:
      - main
    # only version tags. jDeploy creates a tag literally named 'jdeploy' to hold
    # package-info.json, and a 'tags: [*]' filter would re-trigger this workflow on it — publishing
    # a bogus release at version "jdeploy" and pointing dist-tags.latest at it
    tags:
      - '2.0.*'
      # build-android.sh creates "<version>-android" in this repo with the PAT, which would
      # otherwise start a second desktop build of the same version
      - '!2.0.*-android'
  workflow_dispatch:

concurrency:
  group: jdeploy-release-${{ github.repository }}
  cancel-in-progress: false

# needed to create tags and releases
permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: auto-tag on merge to main
  # ==========================================
  tag-release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # CRITICAL: must be a PAT. A push made with the default GITHUB_TOKEN does not trigger
          # workflows, so build-and-deploy below would never run
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Get version and push tag
        run: |
          # the same "2.0.<commit count>" scheme composeApp/build.gradle.kts uses — same commit,
          # same count, so the tag and APP_VERSION always agree
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION="2.0.${COMMIT_COUNT}"

          echo "Calculated version: $VERSION"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "✅ Tag $VERSION already exists. No new release needed."
          else
            echo "▶ Creating and pushing new tag: $VERSION"
            git config user.name "GitHub Actions Bot"
            git config user.email "<>"
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

  # ==========================================
  # JOB 2: build and deploy (triggered by the tag)
  # ==========================================
  build-and-deploy:
    # second guard against publishing jDeploy's own metadata tag, or android's, as a desktop release
    if: ${{ github.ref_type == 'tag' && github.ref_name != 'jdeploy' && !endsWith(github.ref_name, '-android') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gen_release_notes.sh reads the merge commit's PR
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write secrets to gradle.properties
        uses: ./.github/actions/write-secrets
        with:
          secrets_json: ${{ toJSON(secrets) }}

      - name: Setup Node.js & cache npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package.json'

      # the same script a local publish runs: builds the jar, has jDeploy prepare the installers,
      # creates the release on this repo with the jar and the release notes, and updates the
      # 'jdeploy' release's package-info.json. GH_TOKEN reaches it through gradle.properties, and the
      # version is this tag's name
      - name: Build and publish
        run: |
          chmod +x scripts/build-desktop.sh scripts/gen_release_notes.sh
          ./scripts/build-desktop.sh
