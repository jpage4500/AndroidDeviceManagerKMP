name: Build

# Compiles every target on a push or PR. There is no test suite, so compiling on all three is the
# check — commonMain is most of the app, and desktop-only verification is how iOS breaks.
#
# This does NOT publish anything. Releases live in build-desktop.yml and build-android.yml; there
# is no Play Store or TestFlight job (see docs/RELEASING.md).

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'CHANGES.txt'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # desktop + android both compile on Linux, and the APK proves the ktor/D8 dexing still works on
  # minSdk 24 — see docs/PROJECT-SETUP.md
  jvm:
    name: Desktop + Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write secrets to gradle.properties
        uses: ./.github/actions/write-secrets
        with:
          secrets_json: ${{ toJSON(secrets) }}

      - name: Compile desktop
        run: ./gradlew :composeApp:compileKotlinDesktop

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: adm-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1

  # a separate macOS runner: the iOS targets need Xcode's toolchain and cannot be built on Linux
  ios:
    name: iOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write secrets to gradle.properties
        uses: ./.github/actions/write-secrets
        with:
          secrets_json: ${{ toJSON(secrets) }}

      # the Kotlin/Native compiler and its dependencies are a large download; without this every
      # run re-fetches them
      - name: Cache Kotlin/Native compiler
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      # linking is what catches an unresolved symbol an `actual` forgot; compiling alone doesn't
      - name: Link iOS framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
